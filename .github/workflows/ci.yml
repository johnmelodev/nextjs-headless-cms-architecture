name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npx prettier --check "."

      - name: Run ESLint (Linter)
        run: npm run lint

      - name: Run TypeScript Type-Check
        run: npm run type-check

      - name: Build Application (Next.js)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_NAME: "Beauty Headless Store"
          SITECORE_API_URL: "http://localhost:3000/api/cms"
